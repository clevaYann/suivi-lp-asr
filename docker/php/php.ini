; Réglages du projet, ajoutés à php.ini-development.
date.timezone = Europe/Paris

; Import des exports eLearn (CSV / Excel) avec Laravel Excel.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 512M
max_execution_time = 120

; Rend les variables d'environnement du conteneur visibles dans $_ENV
; (utilisé par Laravel Dusk pour trouver le navigateur du service selenium).
variables_order = "EGPCS"
